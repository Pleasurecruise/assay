[project]
name = "assay-panda-adapter"
version = "0.1.0"
description = "Guarded PandaData SDK boundary for Assay"
requires-python = ">=3.12,<3.13"
dependencies = ["panda_data==0.0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panda_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
